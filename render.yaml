# Despliegue en Render (D-27): un solo Web Service sirve la API y la PWA compilada.
# La base de datos vive en Neon: DATABASE_URL se configura en el panel de Render (no se sube al repo).
services:
  - type: web
    name: fastparking
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && node dist/db/cli.js --seed-if-empty && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: DATABASE_URL
        sync: false
      - key: SIMULATOR_API_KEY
        generateValue: true
      - key: RETENTION_MINUTES
        value: "7"
      # v2.0 — agente de IA (D-19): la clave se escribe en el panel de Render, nunca en el repositorio.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_TIMEOUT_MS
        value: "8000"
      # v2.0 — PIN de los controles de /simulacion (D-24)
      - key: DEMO_PIN
        sync: false
